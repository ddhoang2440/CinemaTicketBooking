components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    guestSession:
      type: apiKey
      in: header
      name: X-Guest-Session
      description: Opaque server-issued session token for guest seat hold creation; not the booking access token.
    guestBooking:
      type: apiKey
      in: header
      name: X-Guest-Booking-Token
      description: Opaque token scoped to a booking; stored hashed server-side.
    paymentWebhookHmac:
      type: apiKey
      in: header
      name: x-payment-signature
      description: HMAC over timestamp + raw body; replay window enforced.
  parameters:
    ShowtimeId:
      name: showtimeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  schemas:
    PaginationMeta:
      type: object
      required:
      - page
      - pageSize
      - total
      - totalPages
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
        requestId:
          type: string
    Movie:
      type: object
      required:
      - id
      - title
      - durationMin
      - status
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          example: Phim mẫu tiếng Việt
        synopsis:
          type: string
        durationMin:
          type: integer
          minimum: 1
        posterUrl:
          type: string
          format: uri
        status:
          type: string
          enum:
          - now_showing
          - coming_soon
          - hidden
    Showtime:
      type: object
      required:
      - id
      - movieId
      - auditoriumId
      - startsAt
      - endsAt
      - format
      - state
      properties:
        id:
          type: string
          format: uuid
        movieId:
          type: string
          format: uuid
        auditoriumId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
          example: '2026-12-20T12:30:00Z'
        endsAt:
          type: string
          format: date-time
        format:
          type: string
          enum:
          - 2D
          - 3D
          - IMAX
        state:
          type: string
          enum:
          - draft
          - on_sale
          - sales_paused
          - started
          - completed
    SeatState:
      type: object
      required:
      - id
      - row
      - number
      - type
      - status
      - priceVnd
      properties:
        id:
          type: string
          format: uuid
        row:
          type: string
        number:
          type: integer
          minimum: 1
        type:
          type: string
          enum:
          - standard
          - vip
          - couple
        status:
          type: string
          enum:
          - available
          - held
          - sold
          - unavailable
        priceVnd:
          type: integer
          minimum: 0
        couplePairId:
          type:
          - string
          - 'null'
          format: uuid
    SeatHold:
      type: object
      required:
      - id
      - showtimeId
      - seatIds
      - expiresAt
      - totalVnd
      properties:
        id:
          type: string
          format: uuid
        showtimeId:
          type: string
          format: uuid
        seatIds:
          type: array
          items:
            type: string
            format: uuid
        expiresAt:
          type: string
          format: date-time
        totalVnd:
          type: integer
          minimum: 0
    Booking:
      type: object
      required:
      - id
      - status
      - totalVnd
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - pending_payment
          - confirmed
          - payment_failed
          - expired
          - cancellation_pending
          - cancelled
        totalVnd:
          type: integer
          minimum: 0
        expiresAt:
          type: string
          format: date-time
        guestAccessToken:
          type: string
          description: Returned once for guest booking, scoped to this booking; never logged
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
              additionalProperties: true
    UserProfile:
      type: object
      properties:
        id: *id001
        email:
          type: string
          format: email
        fullName:
          type: string
        roles:
          type: array
          items:
            type: string
      required:
      - id
      - email
      - roles
    Cinema:
      type: object
      properties:
        id: *id001
        name:
          type: string
        address:
          type: string
        city:
          type: string
    Auditorium:
      type: object
      properties:
        id: *id001
        cinemaId: *id001
        name:
          type: string
        supportedFormats:
          type: array
          items:
            type: string
    SeatMap:
      type: object
      properties:
        seatId: *id001
        row:
          type: string
        number:
          type: integer
        seatType:
          type: string
          enum:
          - standard
          - vip
          - couple
        couplePairId:
          type:
          - string
          - 'null'
          format: uuid
    Payment:
      type: object
      properties:
        id: *id001
        bookingId: *id001
        status:
          type: string
          enum:
          - initiated
          - succeeded
          - failed
          - refund_pending
          - refunded
        amountVnd: &id003
          type: integer
          minimum: 0
          description: integer VND, do not send decimals
    Ticket:
      type: object
      properties:
        id: *id001
        bookingId: *id001
        showtimeId: *id001
        seatId: *id001
        status:
          type: string
          enum:
          - valid
          - used
          - cancelled
        qrCode:
          type: string
          description: opaque token, only returned to authorized owner
    ReportSummary:
      type: object
      properties:
        totalTickets:
          type: integer
          minimum: 0
        totalVnd: *id003
        occupancyRate:
          type: number
          minimum: 0
          maximum: 1
    Concession:
      type: object
      properties:
        id: *id001
        name:
          type: string
        unitPriceVnd: *id003
        isAvailable:
          type: boolean
    CheckinVerification:
      type: object
      properties:
        ticketId: *id001
        valid:
          type: boolean
        reason:
          type: string
  responses:
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Business conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
x-accepted-decisions:
  D-04: ACCEPTED — REVISED (2026-11-18) — 3 Express services (core-service, payment-service, notification-service), 1 PostgreSQL (3 owned schemas: core, payment, notification)
  D-05: hold TTL 300 seconds
  D-06: max 8 physical seat IDs per booking
  D-07: cancel >=120 minutes before start, none checked in, mock refund via Payment Service
  D-08: guest booking via email and scoped random guest token (hash stored in core.bookings)
  D-09: mock payment webhook with HMAC/replay prevention/idempotency in Payment Service
  D-10: check-in allowed from T-30 minutes to T+30 minutes
  D-11: showtime room buffer 15 minutes
  D-12: Core Service is authoritative for seat allocation; PG locks and active unique constraints in core schema
  D-13: signed service JWT on internal REST endpoints between core, payment, and notification services
  D-14: shared Redis rate limits
  D-15: couple is exactly two linked seat IDs, atomically sold
  D-18: integer VND and UTC timestamps
