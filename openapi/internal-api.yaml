openapi: 3.1.0
info:
  title: Cinema Internal Service REST API (3-Service Architecture: Core, Payment, Notification)
  version: 0.4.0
  description: >
    Signed service JWT only (D-13). Defines internal service-to-service contracts between
    core-service (:4001), payment-service (:4002), and notification-service (:4003) per
    D-04 (ACCEPTED — REVISED). Documentation contract, not live business implementation.
servers:
  - url: http://localhost:4001
    description: Core Service internal base URL
  - url: http://localhost:4002
    description: Payment Service internal base URL
  - url: http://localhost:4003
    description: Notification Service internal base URL
security:
  - serviceJwt: []
paths:
  /internal/payments/intents:
    post:
      operationId: createInternalPaymentIntent
      summary: Core Service requests Payment Service to initiate a payment intent for a validated booking
      security:
        - serviceJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - bookingId
                - amountVnd
                - idempotencyKey
              properties:
                bookingId: &uuidSchema
                  type: string
                  format: uuid
                amountVnd:
                  type: integer
                  minimum: 0
                  description: Integer VND amount (D-18)
                idempotencyKey:
                  type: string
                  minLength: 8
      responses:
        '201':
          description: Payment intent created or returned idempotently
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - paymentId
                      - status
                    properties:
                      paymentId: *uuidSchema
                      status:
                        type: string
                        enum: [initiated, succeeded, failed]
                      paymentUrl:
                        type: string
                        format: uri
        '401':
          description: Invalid service JWT
        '403':
          description: Insufficient scope
        '409':
          description: Idempotency conflict

  /internal/payments/{paymentId}:
    get:
      operationId: getInternalPaymentStatus
      summary: Core Service retrieves authoritative payment status from Payment Service
      security:
        - serviceJwt: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: *uuidSchema
      responses:
        '200':
          description: Payment status returned
        '401':
          description: Invalid service JWT
        '404':
          description: Payment not found

  /internal/payments/{paymentId}/refund:
    post:
      operationId: createInternalPaymentRefund
      summary: Core Service requests a mock refund from Payment Service (eligible cancellation or late-payment compensation)
      security:
        - serviceJwt: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: *uuidSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - bookingId
                - amountVnd
                - reason
                - idempotencyKey
              properties:
                bookingId: *uuidSchema
                amountVnd:
                  type: integer
                  minimum: 0
                reason:
                  type: string
                  enum: [customer_cancelled, hold_expired_compensation]
                idempotencyKey:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Refund processed idempotently
        '401':
          description: Invalid service JWT
        '403':
          description: Insufficient scope
        '409':
          description: Conflict

  /internal/bookings/{bookingId}/payment-result:
    post:
      operationId: notifyBookingPaymentResult
      summary: Payment Service notifies Core Service of a verified webhook payment outcome to confirm seat allocation and issue QR tickets
      security:
        - serviceJwt: []
      parameters:
        - name: bookingId
          in: path
          required: true
          schema: *uuidSchema
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - paymentId
                - eventId
                - status
                - amountVnd
                - idempotencyKey
              properties:
                paymentId: *uuidSchema
                eventId:
                  type: string
                status:
                  type: string
                  enum: [succeeded, failed]
                amountVnd:
                  type: integer
                  minimum: 0
                idempotencyKey:
                  type: string
                  minLength: 8
      responses:
        '200':
          description: Payment outcome processed idempotently by Core Service
        '401':
          description: Invalid service JWT
        '403':
          description: Insufficient scope
        '409':
          description: Conflict or hold expired requiring refund compensation

  /internal/notifications/send:
    post:
      operationId: sendInternalNotification
      summary: Core Service or Payment Service requests Notification Service to deliver an email notification
      security:
        - serviceJwt: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - templateCode
                - recipientEmail
                - idempotencyKey
              properties:
                templateCode:
                  type: string
                  enum:
                    - email_verification
                    - booking_confirmed
                    - ticket_issued
                    - booking_cancelled
                    - refund_processed
                recipientEmail:
                  type: string
                  format: email
                bookingId: *uuidSchema
                paymentId: *uuidSchema
                payload:
                  type: object
                  additionalProperties: true
                idempotencyKey:
                  type: string
                  minLength: 8
      responses:
        '202':
          description: Notification queued or sent idempotently
        '401':
          description: Invalid service JWT
        '403':
          description: Insufficient scope

components:
  securitySchemes:
    serviceJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Signed service JWT (iss/sub/aud/scope/exp per D-13) between core-service, payment-service, and notification-service
